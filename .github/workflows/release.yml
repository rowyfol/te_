name: Build Linux AMD64 binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build x86_64 Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package binary and example configs
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/telegram-drive-uploader dist/telegram-drive-uploader-linux-amd64
          cp config.example.json config.b2.example.json dist/
          tar -C dist -czf telegram-drive-uploader-linux-amd64.tar.gz telegram-drive-uploader-linux-amd64 config.example.json config.b2.example.json
          sha256sum telegram-drive-uploader-linux-amd64.tar.gz > telegram-drive-uploader-linux-amd64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-uploader-linux-amd64
          path: |
            telegram-drive-uploader-linux-amd64.tar.gz
            telegram-drive-uploader-linux-amd64.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            telegram-drive-uploader-linux-amd64.tar.gz
            telegram-drive-uploader-linux-amd64.tar.gz.sha256
